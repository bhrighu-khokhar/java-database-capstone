<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Smart Clinic</title>

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/adminDashboard.css">
</head>

<body>

<header class="dashboard-header">
    <div class="header-left">
        <h1>Smart Clinic</h1>
        <span>Admin Dashboard</span>
    </div>

    <div class="header-right">
        <span id="adminName">Admin</span>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
</header>


<main class="dashboard-container">

    <section class="dashboard-title">
        <div>
            <h2>Doctor Management</h2>
            <p>View, search and manage clinic doctors.</p>
        </div>

        <button id="openAddDoctorBtn" class="primary-btn">
            + Add Doctor
        </button>
    </section>


    <!-- Filters -->
    <section class="filters">

        <div class="filter-group">
            <label for="searchDoctor">Search Doctor</label>
            <input
                type="text"
                id="searchDoctor"
                placeholder="Search by doctor name..."
            >
        </div>

        <div class="filter-group">
            <label for="specialtyFilter">Specialty</label>

            <select id="specialtyFilter">
                <option value="">All Specialties</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="timeFilter">Available Time</label>

            <select id="timeFilter">
                <option value="">All Times</option>
            </select>
        </div>

        <button id="clearFiltersBtn" class="secondary-btn">
            Clear Filters
        </button>

    </section>


    <!-- Doctor count -->
    <section class="doctor-summary">
        <h3>Doctors</h3>
        <span id="doctorCount">0 doctors</span>
    </section>


    <!-- Loading -->
    <div id="loadingMessage" class="message">
        Loading doctors...
    </div>


    <!-- Error -->
    <div id="errorMessage" class="error-message hidden"></div>


    <!-- Doctor cards -->
    <section id="doctorList" class="doctor-grid">
    </section>

</main>


<!-- Add Doctor Modal -->

<div id="doctorModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Add New Doctor</h2>

            <button
                type="button"
                id="closeDoctorModal"
                class="close-btn">
                &times;
            </button>
        </div>


        <form id="doctorForm">

            <div class="form-group">
                <label for="doctorName">Name</label>

                <input
                    type="text"
                    id="doctorName"
                    name="name"
                    required
                    minlength="3"
                    maxlength="100"
                    placeholder="Dr. John Smith">
            </div>


            <div class="form-group">
                <label for="doctorSpecialty">Specialty</label>

                <input
                    type="text"
                    id="doctorSpecialty"
                    name="specialty"
                    required
                    minlength="3"
                    maxlength="50"
                    placeholder="Cardiology">
            </div>


            <div class="form-group">
                <label for="doctorEmail">Email</label>

                <input
                    type="email"
                    id="doctorEmail"
                    name="email"
                    required
                    placeholder="doctor@example.com">
            </div>


            <div class="form-group">
                <label for="doctorPassword">Password</label>

                <input
                    type="password"
                    id="doctorPassword"
                    name="password"
                    required
                    minlength="6"
                    placeholder="Password">
            </div>


            <div class="form-group">
                <label for="doctorPhone">Phone</label>

                <input
                    type="tel"
                    id="doctorPhone"
                    name="phone"
                    required
                    pattern="[0-9]{10}"
                    placeholder="9876543210">
            </div>


            <div class="form-group">

                <label>Available Times</label>

                <div class="time-checkboxes">

                    <label>
                        <input
                            type="checkbox"
                            name="availableTimes"
                            value="09:00">
                        09:00 AM
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="availableTimes"
                            value="10:00">
                        10:00 AM
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="availableTimes"
                            value="11:00">
                        11:00 AM
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="availableTimes"
                            value="14:00">
                        02:00 PM
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="availableTimes"
                            value="15:00">
                        03:00 PM
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="availableTimes"
                            value="16:00">
                        04:00 PM
                    </label>

                </div>

            </div>


            <div id="formError" class="error-message hidden"></div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelDoctorBtn"
                    class="secondary-btn">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-btn">
                    Add Doctor
                </button>

            </div>

        </form>

    </div>

</div>


<script src="/js/adminDashboard.js"></script>

</body>
</html>
