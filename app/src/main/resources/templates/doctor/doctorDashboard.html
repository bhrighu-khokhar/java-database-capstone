<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Dashboard - Smart Clinic</title>

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/doctorDashboard.css">
</head>

<body>

<header class="dashboard-header">

    <div class="header-left">
        <h1>Smart Clinic</h1>
        <span>Doctor Dashboard</span>
    </div>

    <div class="header-right">
        <span id="doctorName">Doctor</span>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>
    </div>

</header>


<main class="dashboard-container">

    <!-- Dashboard heading -->

    <section class="dashboard-title">

        <div>
            <h2>My Appointments</h2>

            <p>
                View and manage your scheduled patient appointments.
            </p>
        </div>

    </section>


    <!-- Search and date filter -->

    <section class="filters">

        <div class="filter-group">

            <label for="searchPatient">
                Search Patient
            </label>

            <input
                type="text"
                id="searchPatient"
                placeholder="Search by patient name..."
            >

        </div>


        <div class="filter-group">

            <label for="appointmentDate">
                Appointment Date
            </label>

            <input
                type="date"
                id="appointmentDate"
            >

        </div>


        <button
            id="clearFiltersBtn"
            class="secondary-btn">

            Clear Filters

        </button>

    </section>


    <!-- Appointment summary -->

    <section class="appointment-summary">

        <h3>Appointments</h3>

        <span id="appointmentCount">
            0 appointments
        </span>

    </section>


    <!-- Loading message -->

    <div
        id="loadingMessage"
        class="message">

        Loading appointments...

    </div>


    <!-- Error message -->

    <div
        id="errorMessage"
        class="error-message hidden">
    </div>


    <!-- Appointment list -->

    <section
        id="appointmentList"
        class="appointment-grid">
    </section>

</main>


<!-- Patient Prescription Modal -->

<div
    id="prescriptionModal"
    class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Patient Prescriptions</h2>

            <button
                type="button"
                id="closePrescriptionModal"
                class="close-btn">

                &times;

            </button>

        </div>


        <!-- Selected patient -->

        <div class="patient-info">

            <h3 id="prescriptionPatientName">
                Patient
            </h3>

            <p>
                Previous prescriptions
            </p>

        </div>


        <!-- Prescription loading -->

        <div
            id="prescriptionLoading"
            class="message">

            Loading prescriptions...

        </div>


        <!-- Prescription error -->

        <div
            id="prescriptionError"
            class="error-message hidden">
        </div>


        <!-- Prescription list -->

        <div
            id="prescriptionList"
            class="prescription-list">
        </div>


        <div class="modal-actions">

            <button
                type="button"
                id="closePrescriptionBtn"
                class="secondary-btn">

                Close

            </button>

        </div>

    </div>

</div>


<script src="/js/doctorDashboard.js"></script>

</body>

</html>
