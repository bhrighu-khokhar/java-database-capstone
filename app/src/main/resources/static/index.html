<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Role</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 45px;
        }

        .roles {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .role-card {
            width: 250px;
            padding: 35px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: 0.3s;
        }

        .role-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.18);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .role-card h2 {
            margin-bottom: 10px;
        }

        .role-card p {
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        button {
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 90%;
            max-width: 400px;
            background: white;
            color: #111827;
            padding: 30px;
            border-radius: 15px;
            position: relative;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 28px;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Welcome</h1>

    <p class="subtitle">
        Please select your role to continue
    </p>

    <div class="roles">

        <div class="role-card" onclick="openLogin('Admin')">
            <div class="icon">👨‍💼</div>
            <h2>Admin</h2>
            <p>Manage the healthcare system</p>
            <button>Login as Admin</button>
        </div>

        <div class="role-card" onclick="openLogin('Patient')">
            <div class="icon">🧑‍⚕️</div>
            <h2>Patient</h2>
            <p>Access your appointments and records</p>
            <button>Login as Patient</button>
        </div>

        <div class="role-card" onclick="openLogin('Doctor')">
            <div class="icon">👨‍⚕️</div>
            <h2>Doctor</h2>
            <p>Manage patients and appointments</p>
            <button>Login as Doctor</button>
        </div>

    </div>

</div>


<!-- Login Modal -->

<div id="loginModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeLogin()">&times;</span>

        <h2 id="loginTitle">Login</h2>

        <form>

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="login-btn">
                Login
            </button>

        </form>

    </div>

</div>


<script>
let selectedRole="";

function openLogin(role){
selectedRole=role;
document.getElementById("loginTitle").innerText=role+" Login";
document.getElementById("loginModal").style.display="flex";
document.getElementById("username").value="";
document.getElementById("password").value="";
}

function closeLogin(){
document.getElementById("loginModal").style.display="none";
}

window.onclick=function(event){
const modal=document.getElementById("loginModal");
if(event.target===modal) closeLogin();
};

document.querySelector("#loginModal form").addEventListener("submit",async function(event){
event.preventDefault();

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;

if(!username||!password){
alert("Please enter username/email and password");
return;
}

let url;
let body;

if(selectedRole==="Admin"){
url="/admin/login";
body={username:username,password:password};
}else if(selectedRole==="Patient"){
url="/patient/login";
body={email:username,password:password};
}else if(selectedRole==="Doctor"){
url="/doctor/login";
body={email:username,password:password};
}

try{
const response=await fetch(url,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)
});

const data=await response.text();

if(!response.ok){
alert("Login failed: "+data);
return;
}

localStorage.setItem("token",data);
localStorage.setItem("role",selectedRole);

alert("Login successful!");
closeLogin();

if(selectedRole==="Admin"){
window.location.href="/admin.html";
}else if(selectedRole==="Patient"){
window.location.href="/pages/patientDashboard.html";
}else if(selectedRole==="Doctor"){
window.location.href="/doctor.html";
}
}catch(error){
console.error("Login error:",error);
alert("Unable to connect to server.");
}
});
</script>

</body>
</html>
